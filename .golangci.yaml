version: "2"
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errname
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - inamedparam
    - intrange
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - sloglint
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - (*encoding/json.Decoder).Decode
    gomoddirectives:
      replace-allow-list:
        - github.com/gocql/gocql # Scylla's shard-aware fork keeps the gocql module path
    goconst:
      min-len: 3
      min-occurrences: 3
    govet:
      enable:
        - shadow
    perfsprint:
      errorf: false
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - wsl
          - goconst
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G115|G705" # fake credentials, integer overflow, and XSS false positives in tests
      - linters:
          - revive # disable "should have a package comment"
        text: "package comment"
    paths:
      - docs
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - docs
